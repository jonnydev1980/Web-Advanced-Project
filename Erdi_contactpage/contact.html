<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<section class="contact-hero">
    <div>
        <h1>Na Kontaktoni</h1>
        <p>Auto Salloni më i besuar për automjete premium</p>
    </div>
</section>

<section class="container">

    <div class="info-box">

        <h2>Informacionet e Kontaktit</h2>

        <div class="info-item">
            <i class="fas fa-phone"></i>
            <div>
                <h3>Telefoni</h3>
                <p>+383 44 123 456</p>
            </div>
        </div>

        <div class="info-item">
            <i class="fas fa-envelope"></i>
            <div>
                <h3>Email</h3>
                <p>info@autosalloni.com</p>
            </div>
        </div>

        <div class="info-item">
            <i class="fas fa-location-dot"></i>
            <div>
                <h3>Adresa</h3>
                <p>Prishtinë, Kosovë</p>
            </div>
        </div>

        <div class="action-buttons">

            <a href="tel:+38344123456" class="btn call">
                <i class="fas fa-phone"></i> Thirr
            </a>

            <a href="https://wa.me/38344123456" class="btn whatsapp">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>

            <a href="mailto:info@autosalloni.com" class="btn email">
                <i class="fas fa-envelope"></i> Email
            </a>

        </div>

        <div class="socials">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>

    </div>

    <div class="form-box">

        <h2>Dërgo Mesazh</h2>

        <form id="contactForm">

            <div class="input-group">
                <input type="text" placeholder="Emri juaj" required>
            </div>

            <div class="input-group">
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <input type="tel" placeholder="Telefoni">
            </div>

            <div class="input-group">
                <textarea placeholder="Mesazhi juaj"></textarea>
            </div>

            <button type="submit" class="send-btn">
                Dërgo Kërkesën
            </button>

        </form>

    </div>

</section>

<section class="map">
    <iframe
        src="https://maps.google.com/maps?q=Prishtine&t=&z=13&ie=UTF8&iwloc=&output=embed">
    </iframe>
</section>

<script src="script.js"></script>

</body>
</html>
